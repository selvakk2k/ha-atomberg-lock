sync:
  name: Sync Status & Logs
  description: Synchronizes lock battery, status, and event activity logs over BLE and Cloud.
  fields:
    device_id:
      name: Device
      description: Atomberg lock device to sync.
      required: false
      selector:
        device:
          integration: atomberg_lock
    entity_id:
      name: Entity
      description: Lock entity to sync.
      required: false
      selector:
        entity:
          domain: lock
